<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual Garden</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 16px/1.45 ui-serif, "Iowan Old Style", Georgia, serif;
      color: #2a241c;
      background: #f4efe6;
    }
    main { text-align: center; padding: 40px 20px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    .lede { color: #5a5348; margin: 0 0 24px; }
    .lede a { color: #2a241c; }
    canvas {
      display: block;
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
      background: transparent;
    }
    .phases { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .phases button {
      font: inherit;
      font-size: 13px;
      border: 1px solid #c9c0b0;
      background: #fff;
      color: #2a241c;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .phases button[aria-pressed="true"] {
      background: #2a241c;
      color: #f4efe6;
      border-color: #2a241c;
    }
  </style>
</head>
<body>
  <main>
    <h1>Virtual Garden</h1>
    <p class="lede">
      A quiet zen dish. Load unpacked from
      <a href="https://github.com/roiyot26/virtual-garden">the repo</a>.
    </p>
    <canvas id="dish" width="200" height="200"></canvas>
    <div class="phases" role="group" aria-label="Garden phase">
      <button type="button" data-phase="1" aria-pressed="true">Thriving</button>
      <button type="button" data-phase="2">Serene</button>
      <button type="button" data-phase="3">Neutral</button>
      <button type="button" data-phase="4">Unsettled</button>
      <button type="button" data-phase="5">Neglected</button>
    </div>
  </main>
  <script type="module">
    import { zenScene } from "./scenes.js";

    const canvas = document.getElementById("dish");
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const SIZE = 200;
    canvas.width = Math.round(SIZE * dpr);
    canvas.height = Math.round(SIZE * dpr);
    const ctx = canvas.getContext("2d");

    let phase = 1;

    function paint(t) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, SIZE, SIZE);
      zenScene(ctx, SIZE, SIZE, phase, {}, t);
    }

    function frame(t) {
      paint(t);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    document.querySelector(".phases").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-phase]");
      if (!btn) return;
      phase = Number(btn.dataset.phase);
      for (const b of document.querySelectorAll(".phases button")) {
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      }
    });
  </script>
</body>
</html>
